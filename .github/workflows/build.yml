name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Owner-only gate: run only when the repo owner triggers it; PRs must also be owner-authored and not from forks.
  verify:
    if: github.triggering_actor == github.repository_owner && (github.event_name != 'pull_request' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: '17' }
          - { os: ubuntu-latest, java: '21' }
          - { os: windows-latest, java: '21' }
          - { os: macos-latest, java: '21' }
          # Maven 4 is still a release candidate: report, don't block.
          - { os: ubuntu-latest, java: '21', maven4: '4.0.0-rc-7' }
    name: verify (${{ matrix.os }}, java ${{ matrix.java }}${{ matrix.maven4 && ', maven 4' || '' }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","pc-builder"]') || 'ubuntu-latest') || matrix.os }}
    continue-on-error: ${{ matrix.maven4 != '' && matrix.maven4 != null }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The ITs resolve Spring Boot into an isolated repository; keep it between runs.
      - uses: actions/cache@v6
        with:
          path: dependency-analyze-kit-maven-plugin/target/local-repo
          key: it-repo-${{ runner.os }}-${{ hashFiles('dependency-analyze-kit-maven-plugin/src/it/**/pom.xml') }}
          restore-keys: it-repo-${{ runner.os }}-
      # Self-hosted pc-builder image has no system Maven (hosted runners do).
      - name: Set up Maven if missing
        shell: bash
        run: command -v mvn >/dev/null || { curl -fsSL --retry 3 https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz | tar xz -C "$RUNNER_TEMP" && echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"; }
      - if: matrix.maven4
        shell: bash
        run: |
          curl -sSfL "https://archive.apache.org/dist/maven/maven-4/${{ matrix.maven4 }}/binaries/apache-maven-${{ matrix.maven4 }}-bin.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${{ matrix.maven4 }}/bin" >> "$GITHUB_PATH"
      - run: mvn -v && mvn -B -ntp verify
        shell: bash
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: it-logs-${{ matrix.os }}-java${{ matrix.java }}${{ matrix.maven4 && '-maven4' || '' }}
          path: dependency-analyze-kit-maven-plugin/target/it/**/build.log

  # Runs the Gradle plugin and probe built from this commit against a multi-project Spring Boot build.
  gradle-it:
    if: github.triggering_actor == github.repository_owner && (github.event_name != 'pull_request' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        boot-version: ['3.5.16', '4.0.8']
    name: gradle-it (Boot ${{ matrix.boot-version }}, Java ${{ matrix.java }})
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","pc-builder"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Self-hosted pc-builder image has no system Maven (hosted runners do).
      - name: Set up Maven if missing
        shell: bash
        run: command -v mvn >/dev/null || { curl -fsSL --retry 3 https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz | tar xz -C "$RUNNER_TEMP" && echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"; }
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.8.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: mvn -B -ntp install -DskipTests -Dinvoker.skip=true
      - run: python3 -I dependency-analyze-kit-gradle-plugin/src/it/verify.py gradle ${{ matrix.boot-version }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-it-logs-boot${{ matrix.boot-version }}-java${{ matrix.java }}
          path: dependency-analyze-kit-gradle-plugin/target/it/*.log

  # Builds sources and javadoc jars the way a release does, without signing or uploading.
  release-dry-run:
    if: github.triggering_actor == github.repository_owner && (github.event_name != 'pull_request' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","pc-builder"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Self-hosted pc-builder image has no system Maven (hosted runners do).
      - name: Set up Maven if missing
        shell: bash
        run: command -v mvn >/dev/null || { curl -fsSL --retry 3 https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz | tar xz -C "$RUNNER_TEMP" && echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"; }
      - run: mvn -B -ntp -Prelease -Dgpg.skip -DskipTests -Dinvoker.skip=true verify
      - run: ls */target/*-sources.jar */target/*-javadoc.jar
